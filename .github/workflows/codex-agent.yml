name: Codex Agent

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  codex-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Read the GitHub issue title and body.
            Implement the requested Flutter change.
            Modify only relevant files.
            Keep the existing architecture.
            Do not push directly to main.
            If Drift database files changed, run build_runner.
            Ensure code compiles.

      - name: Generate Drift files if needed
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Codex automated update"
          title: "Codex: Automated Flutter update"
          body: |
            Automated changes generated by Codex.

            Please review and test before merging.
          branch: codex/${{ github.run_id }}