name: Codex Agent

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to implement"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  codex-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            You are working on the VillaBooks Flutter app.

            Read the GitHub issue title and body.
            Implement the requested Flutter change.

            Rules:
            - Modify only relevant files.
            - Keep existing architecture.
            - Do not push directly to main.
            - Do not make unrelated refactoring.
            - If Drift/Riverpod generated files are needed, update source files first.
            - Ensure code is clean and compile-ready.

      - name: Generate files
        run: |
          dart run build_runner clean
          dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Codex automated update"
          title: "Codex: Automated Flutter update"
          body: |
            Automated changes generated by Codex.

            Notes:
            - Review generated code before merging.
            - Check build_runner output.
            - Run app locally before merge.
          branch: codex/${{ github.run_id }}
          delete-branch: true