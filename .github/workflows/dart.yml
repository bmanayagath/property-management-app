name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional build number, higher than the last upload for this version'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Sign and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Check signing and upload settings
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 APPSTORE_API_PRIVATE_KEY APPSTORE_API_KEY_ID APPSTORE_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions setting: $name. See the TestFlight section in README.md."
              exit 1
            fi
          done
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Build number must be a positive integer."
            exit 1
          fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          ruby -c ci_scripts/configure_testflight_signing.rb

      - name: Prepare Flutter and CocoaPods
        run: |
          flutter pub get
          flutter build ios --config-only --release --build-number="$BUILD_NUMBER"
          cd ios
          pod install --repo-update

      - name: Install distribution certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/testflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          ruby ci_scripts/configure_testflight_signing.rb

      - name: Build signed App Store IPA
        run: |
          set -o pipefail
          flutter build ipa --release --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --verbose 2>&1 | tee "$RUNNER_TEMP/testflight-build.log"
          ipas=(build/ios/ipa/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ] || [ ! -f "${ipas[0]}" ]; then
            echo "::error::Expected exactly one signed IPA in build/ios/ipa."
            exit 1
          fi

      - name: Locate signed IPA
        id: ipa
        run: |
          ipas=(build/ios/ipa/*.ipa)
          echo "path=${ipas[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect for TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Save signed IPA and debug symbols
        if: ${{ !cancelled() && steps.ipa.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: testflight-${{ env.BUILD_NUMBER }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 7

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testflight-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/testflight.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/testflight.keychain-db"
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
