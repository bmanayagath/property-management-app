name: villabooks
description: A Flutter landlord finance app to track villas, tenants, rental income, and expenses.
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  cloud_firestore: ^6.4.1
  collection: ^1.18.0
  connectivity_plus: 6.1.5
  csv: ^8.0.0
  cupertino_icons: ^1.0.2
  drift: ^2.13.0
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  font_awesome_flutter: ^10.8.0
  freezed_annotation: ^2.4.1
  geocoding: ^4.0.0
  geolocator: ^14.0.1
  google_maps_flutter: ^2.17.0
  http: ^1.2.0
  intl: ^0.19.0
  json_annotation: ^4.8.1
  path: ^1.8.3
  path_provider: ^2.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  riverpod_annotation: ^2.3.0
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.0
  url_launcher: ^6.3.2
  uuid: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.13.0
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
